<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQ3 Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background: radial-gradient(120% 120% at 50% 0%, #4a1212 0%, #2a0a0a 30%, #160505 100%);
    min-height:100vh; font-family:'Inter',sans-serif; color:#fff;
  }
  /* LOGIN */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:380px; 
    background: linear-gradient(180deg, #2a0d0d 0%, #1a0808 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:28px; padding:32px 28px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .logo-box{ display:flex; justify-content:center; margin-bottom:18px; }
  .logo-box img{
    width:132px; height:132px; border-radius:50%; 
    object-fit:cover; box-shadow: 0 0 0 2px rgba(212,175,55,0.3), 0 8px 30px rgba(0,0,0,0.5);
  }
  .admin-label{
    text-align:center; color:#9a7a7a; font-size:14px; letter-spacing:0.5px; margin-bottom:20px;
  }
  .input-pill{
    width:100%; height:52px; background:#3d2d3d; border:1px solid rgba(255,255,255,0.06);
    border-radius:999px; padding:0 20px; color:#fff; font-size:14px; outline:none;
  }
  .input-pill::placeholder{color:#7a5a5a}
  .input-pill:focus{border-color:rgba(212,175,55,0.4)}
  .stack{display:flex; flex-direction:column; gap:12px}
  .btn-gold{
    width:100%; height:52px; border:none; border-radius:999px; 
    background: linear-gradient(180deg, #E8D5A3 0%, #D4AF37 100%);
    color:#3a1a0a; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow: 0 6px 18px rgba(212,175,55,0.35); margin-top:4px;
  }
  .btn-gold:hover{filter:brightness(1.05)}
  .err{color:#ff8a8a; font-size:12px; text-align:center; display:none; margin-top:8px}

  /* DASHBOARD */
  #dashboard{display:none; min-height:100vh;}
  .dash-head{padding:18px 20px 10px; border-bottom:1px solid rgba(255,255,255,0.06); background:rgba(0,0,0,0.2)}
  .dash-title{font-family:'Great Vibes',cursive; font-size:34px; color:#f3e5ab; line-height:1}
  .dash-sub{color:#c9a0a0; font-size:12px; margin-top:4px}
  .tabs{display:flex; gap:8px; overflow:auto; padding:12px 16px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    white-space:nowrap; padding:8px 16px; border-radius:999px; 
    font-size:12px; font-weight:600; border:1px solid rgba(255,255,255,0.1);
    background:#2a1212; color:#c9a0a0; cursor:pointer;
  }
  .tab.active{background:linear-gradient(180deg,#E8D5A3,#D4AF37); color:#3a0a0a; border-color:transparent}
  .table-wrap{margin:12px 16px; background:#2a0f0f; border:1px solid rgba(255,255,255,0.06); border-radius:16px; overflow:auto}
  table{width:100%; border-collapse:collapse; min-width:900px}
  th{text-align:left; font-size:10px; letter-spacing:1px; color:#8a6a6a; padding:14px 16px; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.06)}
  td{padding:12px 16px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); color:#e8d0d0}
  .pill{padding:5px 12px; border-radius:999px; font-size:11px; font-weight:700;}
  .PENDING{background:#E8D5A3; color:#3a0a0a} .PAID{background:#4ade80; color:#0a2a0a} .DONE{background:#60a5fa; color:#0a1a3a}
  .btn-del{padding:6px 12px; border-radius:999px; border:1px solid rgba(255,120,120,0.3); background:rgba(0,0,0,0.2); color:#ff8a8a; font-size:11px; cursor:pointer}
  .topbar{display:flex; justify-content:space-between; align-items:center; padding:0 16px 12px}
  .logout{padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,0.12); background:transparent; color:#c9a0a0; cursor:pointer; font-size:12px}
</style>
</head>

function login(){
  const e = document.getElementById('email').value.trim();
  const p = document.getElementById('pass').value.trim();
  if(e==="admin@mq3music.com" && p==="mq3admin123"){
    document.getElementById('login').style.display='none';
    document.getElementById('dashboard').style.display='block';
    renderTabs(); renderTable();
  }else{
    document.getElementById('err').style.display='block';
  }
}
function logout(){
  document.getElementById('dashboard').style.display='none';
  document.getElementById('login').style.display='flex';
}
function renderTabs(){
  const c=document.getElementById('tabs'); c.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(t===activeTab?' active':''); b.textContent=t;
    b.onclick=()=>{activeTab=t; renderTabs(); renderTable();};
    c.appendChild(b);
  });
}
function renderTable(){
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  data.forEach((row,i)=>{
    const tr=document.createElement('tr');
    const status=row[6];
    tr.innerHTML=`<td>${row[0]}</td><td style="font-weight:600; color:#fff;">${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[4]}</td><td>${row[5]}</td><td><span class="pill ${status}">${status}</span></td><td><button class="btn-del" onclick="delRow(${i})">Delete</button> <button class="btn-del" style="border-color:rgba(212,175,55,0.4); color:#E8D5A3;" onclick="toggleStatus(${i})">Mark Paid</button></td>`;
    tb.appendChild(tr);
  });
  const paid=data.filter(r=>r[6]==="PAID").length;
  const pending=data.filter(r=>r[6]==="PENDING").length;
  document.getElementById('stats').textContent=`${data.length} shown · ${paid} paid · ${pending} pending`;
}
function delRow(i){ if(confirm('Delete this request?')){ data.splice(i,1); renderTable(); } }
function toggleStatus(i){ data[i][6]= data[i][6]==="PENDING" ? "PAID" : "PENDING"; renderTable(); }

// Enter to login
document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });

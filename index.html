<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MQ3 — Music. Quality. 3rd Gen.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- TOP HEADER - EXACT GAYA SA SCREENSHOT MO -->
  <header class="top">
    <a class="brand" href="#">
      <img src="logo.png" alt="MQ3" class="brand-seal">
      <div class="brand-text">
        <span class="brand-title">MQ3</span>
        <small>MUSIC. QUALITY. 3RD GEN.</small>
      </div>
    </a>
    <nav class="main-nav">
      <button class="nav">Home</button>
      <button class="nav active">Browse</button>
      <button class="nav">Library</button>
      <button class="nav">Favorites</button>
    </nav>
    <div class="header-actions">
      <div class="searchbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a8a7a" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" placeholder="Search your songs...">
      </div>
      <button class="button primary add-btn">+ &nbsp; Add songs</button>
    </div>
  </header>

  <!-- HERO - EXACT GAYA SA SCREENSHOT -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="heroCopy">
      <div class="eyebrow">MUSIC. QUALITY. 3RD GEN.</div>
      <div class="hero-logo">MQ3</div>
      <h1>Real music. Real emotions.</h1>
      <p>Personal stories. Filipino soul. A sound for every moment in life.</p>
      <div class="hero-actions">
        <button class="button primary play-btn">▶ &nbsp; Start listening</button>
        <button class="hero-link">Explore collections ↗</button>
      </div>
    </div>
    <span class="hero-signature">THE SOUND OF MQ3 —</span>
  </section>
</body>
</html>
